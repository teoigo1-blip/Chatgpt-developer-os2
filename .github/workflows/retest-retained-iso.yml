name: Verify retained productivity ISO
on:
  push:
    branches: [codex/windows-iso]
    paths: [.github/workflows/retest-retained-iso.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact retained ISO
        uses: actions/download-artifact@v4
        with:
          name: chatgpt-developer-os-iso-unverified
          run-id: 39171153842
          github-token: ${{ github.token }}
          path: image
      - name: Verify retained checksum
        run: |
          cd image
          sha256sum -c SHA256SUMS
      - name: Install verification dependencies
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf xorriso cryptsetup-bin
      - name: Validate host scripts
        run: |
          python3 -m py_compile capture-qemu-screen.py ci-persistence-test.py
          bash -n ci-qemu-boot.sh qemu-serial-boot-check.sh
          chmod +x ci-qemu-boot.sh qemu-serial-boot-check.sh
      - name: Retrieve successful BIOS and UEFI evidence for this exact retained ISO
        uses: actions/download-artifact@v4
        with:
          name: productivity-iso-evidence
          run-id: 39173591944
          github-token: ${{ github.token }}
          path: prior-evidence
      - name: Validate prior boot and tool results
        run: |
          python3 - <<'PY'
          import pathlib,re,shutil
          root=pathlib.Path('prior-evidence/boot-evidence')
          for mode in ('bios','uefi'):
              assert 'exit_code=0' in (root/(mode+'.status')).read_text()
              log=(root/(mode+'.log')).read_text()
              for marker in ('GUEST_TOOLCHECK_OK','GUEST_CONTAINER_OK'):
                  assert re.search(r'(?m)^'+marker+r'\r?$',log), (mode,marker)
              print(mode+': confirmed strict tools and rootless container in run 39173591944')
          shutil.copytree(root,'dist/boot-evidence',dirs_exist_ok=True)
          PY
      - name: Test encrypted persistence across two boots
        run: |
          iso=$(find image -maxdepth 1 -name '*.iso' -print -quit)
          python3 ci-persistence-test.py "$iso"
      - name: Record verified provenance
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          image=next(pathlib.Path('image').glob('*.iso'))
          report={'iso_source_run':39171153842,'iso_source_commit':'806586b0e60e4625a2b690901103f257bc822cf7','boot_verification_run':39173591944,'verification_run':os.environ['GITHUB_RUN_ID'],'verification_commit':os.environ['GITHUB_SHA'],'sha256':hashlib.file_digest(image.open('rb'),'sha256').hexdigest(),'iso_bytes':image.stat().st_size,'bios_user_tools_passed':True,'uefi_user_tools_passed':True,'rootless_containers_passed':True,'encrypted_persistence':json.loads(pathlib.Path('dist/persistence-evidence/result.json').read_text()),'physical_usb_tested':False}
          pathlib.Path('image/verification.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          PY
      - name: Upload all verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: productivity-iso-evidence
          path: |
            dist/boot-evidence/
            dist/persistence-evidence/
          if-no-files-found: error
      - name: Upload verified ISO and integrity report
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-developer-os-iso
          path: image/
          compression-level: 0
          retention-days: 14

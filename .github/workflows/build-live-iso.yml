
name: Build Live USB ISO

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release only after build and boot checks pass"
        type: boolean
        required: true
        default: false
      release_tag:
        description: "New tag for release (e.g. v4.2-iso1)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  iso:
    name: Build and test ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore missing v4.2 source files from bundled archive
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import zipfile
          root = Path.cwd().resolve()
          archive = root / 'ChatGPTDeveloperOS_v4.2_LiveUSB_SOURCE.zip'
          restored = []
          with zipfile.ZipFile(archive) as z:
              for line in (root / 'SOURCE_SHA256SUMS').read_text().splitlines():
                  expected, relative = line.split('  ', 1)
                  path = (root / relative).resolve()
                  if not path.is_relative_to(root):
                      raise SystemExit('Invalid source path')
                  if path.is_file():
                      continue
                  matches = [n for n in z.namelist() if n.endswith('/' + relative) or n == relative]
                  if len(matches) != 1:
                      raise SystemExit('Missing or ambiguous archive entry: ' + relative)
                  data = z.read(matches[0])
                  if hashlib.sha256(data).hexdigest() != expected:
                      raise SystemExit('Original checksum mismatch: ' + relative)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(data)
                  restored.append(relative)
          print('Restored original source files:', *restored, sep='\n')
          PY
          find config/hooks config/includes.chroot/usr/local/bin -type f -exec chmod 755 {} +

      - name: Enable script execution
        run: |
          find . -maxdepth 1 -type f \( -name '*.sh' -o -name '*.py' \) -exec chmod +x {} +

      - name: Reclaim space on ephemeral GitHub runner
        run: bash ./ci-runner-space.sh

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            syslinux-common \
            isolinux \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            qemu-system-x86 \
            ovmf \
            file

      - name: Check build host and free space
        run: ./ci-environment-check.sh

      - name: Validate scripts and configuration
        run: |
          ./prebuild-gate.sh
          bash -n build.sh ci-build-iso.sh ci-qemu-boot.sh github-preflight.sh
          ./github-preflight.sh
          python3 ./check-build-inputs.py
          python3 ./validate-workflow.py
          python3 ./check-target-packages.py
          ./verify-boot-config.sh

      - name: Check workflow and shell syntax
        run: |
          bash -n ci-build-iso.sh qemu-serial-boot-check.sh
          python3 -m py_compile \
            check-build-inputs.py \
            check-target-packages.py

      - name: Note target distribution
        run: |
          echo "Target distribution: Debian 13 (trixie)"
          echo "Packages will be resolved during live-build."

      - name: Ensure fresh build output
        run: |
          if [ -d dist ]; then
            echo "Unexpected pre-existing dist directory" >&2
            exit 1
          fi

      - name: Build Debian Live image
        run: |
          docker run --rm --privileged \
            -v "$PWD:/workspace" -w /workspace \
            debian:trixie bash -lc '
              set -Eeuo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y live-build debootstrap debian-archive-keyring xorriso squashfs-tools syslinux-common isolinux grub-pc-bin grub-efi-amd64-bin mtools dosfstools file sudo ca-certificates
              sudo ./ci-build-iso.sh "$PWD/dist"
            '

      - name: Restore artifact ownership for verification and diagnostics
        if: always()
        run: |
          if [ -d dist ]; then
            sudo chown -R "$(id -u):$(id -g)" dist
          fi

      - name: Locate and verify artifact
        shell: bash
        run: |
          mapfile -t images < <(find dist -maxdepth 1 -type f -name '*.iso' -print)

          if [ "${#images[@]}" -ne 1 ]; then
            echo "Expected exactly one ISO image" >&2
            exit 1
          fi

          ./verify-iso.sh "${images[0]}"
          ./inspect-iso-boot-files.sh "${images[0]}"

          python3 ./iso-artifact-report.py \
            "${images[0]}" \
            --output iso-artifact.json

          test -s iso-artifact.json

          cp -- "${images[0]}" release.iso
          sha256sum release.iso > iso.sha256
          sha256sum -c iso.sha256

      - name: Inspect generated artifact sizes
        run: |
          test -s release.iso
          test -s iso.sha256
          test -s iso-artifact.json
          du -h release.iso

      - name: Validate QEMU BIOS and UEFI prerequisites
        run: ./boot-test-preflight.sh release.iso

      - name: Test BIOS kernel boot
        run: ./ci-qemu-boot.sh release.iso bios 120

      - name: Test UEFI kernel boot
        run: ./ci-qemu-boot.sh release.iso uefi 120

      - name: Upload boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-evidence
          path: dist/boot-evidence/
          if-no-files-found: ignore

      - name: Analyze build log on failure
        if: failure()
        run: |
          if [ -s dist/build.log ]; then
            python3 diagnose-build.py \
              dist/build.log \
              --output dist/build-diagnosis.json
          else
            echo "No build log was produced."
          fi

      - name: Upload source validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-validation
          path: |
            test-results.json
            dist/build.log
          if-no-files-found: ignore

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: test-results.json
          if-no-files-found: ignore

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            dist/build.log
            dist/build-diagnosis.json
            .build/logs/
          if-no-files-found: ignore

      - name: Upload ISO and integrity report
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-developer-os-iso
          path: |
            release.iso
            iso.sha256
            iso-artifact.json
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: iso
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Validate release tag
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$ ]] || {
            echo "Invalid release tag" >&2
            exit 1
          }

      - name: Download verified ISO
        uses: actions/download-artifact@v4
        with:
          name: chatgpt-developer-os-iso
          path: release

      - name: Verify downloaded ISO
        run: |
          cd release
          sha256sum -c iso.sha256
          test -s release.iso

      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing overwrite" >&2
            exit 1
          fi

          gh release create "$TAG" \
            release/release.iso \
            release/iso.sha256 \
            release/iso-artifact.json \
            --title "ChatGPT Developer OS $TAG" \
            --notes "Automated ISO build and QEMU BIOS/UEFI boot checks passed. Real hardware and USB persistence remain unverified." \
            --prerelease
